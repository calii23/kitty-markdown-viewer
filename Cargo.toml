[package]
name = "tui-markdown-viewer"
version = "0.1.0"
edition = "2024"
description = "Full-screen Markdown viewer for kitty with images, scaled headings and a table of contents"

[[bin]]
name = "mdv"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25.10"
libc = "0.2.189"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = "0.13.4"
resvg = "0.48.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.2"
ureq = "3.4.2"
